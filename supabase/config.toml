# Configuração mínima para `supabase start` local. O projeto real é configurado no painel.
project_id = "ninho"

[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
minimum_password_length = 8

[auth.email]
enable_confirmations = true

[functions.send-reminders]
verify_jwt = false   # protegida por x-cron-secret

[functions.payment-webhook]
verify_jwt = false   # protegida pela assinatura do Mercado Pago
