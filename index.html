<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#452f45" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15121e" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ninho — caderneta digital da gestante, baseada na Caderneta Brasileira da Gestante (Ministério da Saúde).">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'">
<title>Ninho — sua gestação, no aconchego de um só lugar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,400..500&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <!-- Autenticação e configuração inicial (renderizadas por js/app.js) -->
  <div class="onb hidden" id="auth" aria-live="polite"></div>
  <div class="onb hidden" id="setup" aria-live="polite"></div>

  <div id="boot" class="onb"><div class="onb-logo">🪺</div><h1>Ninho</h1><div class="tag">carregando…</div></div>

  <!-- APP -->
  <div id="main" class="hidden">
    <div id="banners"></div>
    <div id="header"></div>
    <main>
      <div id="pg-home" class="page"></div>
      <div id="pg-timeline" class="page hidden"></div>
      <div id="pg-record" class="page hidden"></div>
      <div id="pg-help" class="page hidden"></div>
      <div id="pg-me" class="page hidden"></div>
    </main>
    <div class="notice">🔒 Seus dados de saúde são protegidos e só você tem acesso.<br>Ninho é um apoio ao acompanhamento e não substitui sua equipe de saúde.</div>

    <nav class="nav" aria-label="Navegação principal">
      <button class="on" data-pg="home" onclick="go('home')" aria-label="Início"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.6 10v9a1 1 0 0 0 1 1H9.6v-4.6a1 1 0 0 1 1-1h2.8a1 1 0 0 1 1 1V20h3a1 1 0 0 0 1-1v-9"/></svg>Início</button>
      <button data-pg="timeline" onclick="go('timeline')" aria-label="Jornada"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 20c0-3 2-4.2 5-4.2s5-1.2 5-4.2"/><circle cx="4.5" cy="20" r="1.5"/><path d="M17.5 3.2c1.9 0 3.3 1.4 3.3 3.2 0 2.4-3.3 5-3.3 5s-3.3-2.6-3.3-5c0-1.8 1.4-3.2 3.3-3.2z"/><circle cx="17.5" cy="6.4" r="1"/></svg>Jornada</button>
      <button data-pg="record" onclick="go('record')" aria-label="Prontuário"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="16.5" rx="2.6"/><path d="M9 4.5V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v.5"/><path d="M8 14.5h2l1.3 2.6L13.2 11l1.3 3.5H16"/></svg>Prontuário</button>
      <button data-pg="help" onclick="go('help')" aria-label="Ajuda e sinais de perigo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.8a2 2 0 0 1-2 2H9.5L5.5 19v-3.2H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/><path d="M10 9.3a2.1 2.1 0 1 1 3.1 1.9c-.7.4-1.1.9-1.1 1.6"/><circle cx="12" cy="13.6" r=".6" fill="currentColor" stroke="none"/></svg>Ajuda</button>
      <button data-pg="me" onclick="go('me')" aria-label="Eu e configurações"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.3C7.2 16.9 3.8 13.8 3.8 9.9 3.8 7.3 5.8 5.3 8.3 5.3c1.6 0 3 .8 3.7 2 .7-1.2 2.1-2 3.7-2 2.5 0 4.5 2 4.5 4.6 0 3.9-3.4 7-8.2 10.4z"/></svg>Eu</button>
    </nav>
    <button class="fab" onclick="quickAdd()" aria-label="Registro rápido"><i class="ph ph-plus"></i></button>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/clinical.js"></script>
<script src="js/store.js"></script>
<script src="js/alerts.js"></script>
<script src="js/notify.js"></script>
<script src="js/app.js"></script>
</body>
</html>
